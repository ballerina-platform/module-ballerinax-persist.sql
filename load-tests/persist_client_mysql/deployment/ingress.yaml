---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: persist-client-mysql
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  rules:
    - host: bal.perf.test
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: perf-app
                port:
                  number: 9090
